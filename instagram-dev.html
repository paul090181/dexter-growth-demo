<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GrowthWise Instagram Integration</title>
  <style>body{margin:0;background:#edf0f3;color:#14202c;font:16px system-ui,sans-serif}.shell{max-width:560px;margin:48px auto;padding:24px}.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 12px 40px #0e1b2b14}.primary{border:0;border-radius:12px;padding:12px 16px;background:#0e1b2b;color:#fff;font-weight:750}.key{width:100%;box-sizing:border-box;padding:11px;margin:8px 0 18px}</style>
</head>
<body><main class="shell"><h1>Instagram integration</h1><p>This page exists only for the current GrowthWise development beta acceptance.</p><section class="card"><label for="admin-key">GrowthWise beta admin key</label><input class="key" id="admin-key" type="password" autocomplete="current-password"><div id="instagram-connection"></div></section><section class="card" style="margin-top:20px"><h2>TEMPORARY ACCEPTANCE HARNESS — REMOVE BEFORE MERGE</h2><p>Deploy Preview only. Runs synthetic database checks without contacting Meta.</p><button class="primary" id="database-acceptance" type="button">Run database acceptance</button><ul id="database-acceptance-status" aria-live="polite"></ul></section></main>
<script type="module">
  import { mountInstagramConnection } from "./assets/instagram-connection.mjs";
  const input = document.querySelector("#admin-key");
  const connection = mountInstagramConnection({
    root: document.querySelector("#instagram-connection"), businessId: "growthwise-dev",
    getAdminKey: () => input.value || sessionStorage.getItem("growthwise_admin_key") || "",
  });
  input.addEventListener("change", () => {
    sessionStorage.setItem("growthwise_admin_key", input.value);
    connection.loadHealth();
  });
  document.querySelector("#database-acceptance").addEventListener("click", async () => {
    const status = document.querySelector("#database-acceptance-status");
    status.textContent = "Running safe preview checks…";
    try {
      const response = await fetch("/.netlify/functions/instagram-database-acceptance", {
        method: "POST", headers: { "X-GrowthWise-Key": input.value },
      });
      const result = await response.json();
      status.textContent = "";
      for (const check of Array.isArray(result.checks) ? result.checks : []) {
        const item = document.createElement("li");
        item.textContent = `${check.name}: ${check.status}`;
        status.append(item);
      }
      if (!response.ok && status.childElementCount === 0) status.textContent = "Acceptance could not run.";
    } catch { status.textContent = "Acceptance could not run."; }
  });
</script></body></html>
