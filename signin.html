<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0e1b2b" />
  <title>Secure sign in | GrowthWise</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#eef1f4;color:#14202c;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(520px,100%);background:#fff;border:1px solid #e1e6ea;border-radius:22px;padding:26px;box-shadow:0 12px 34px rgba(14,27,43,.08)}.brand{font-weight:950;font-size:18px}.eyebrow{margin-top:22px;color:#96702c;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}h1{margin:7px 0 10px;font-size:32px;line-height:1.08}p{color:#5d6974;line-height:1.55}.status{margin-top:16px;border-radius:13px;padding:13px;background:#eef5ff;color:#294f7a;font-size:13px;font-weight:800;line-height:1.5}.status.error{background:#fff0ee;color:#87372e}.button{display:block;margin-top:16px;border-radius:13px;padding:13px 16px;background:#0e1b2b;color:#fff;font-weight:850;text-align:center;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">GrowthWise</div>
    <div class="eyebrow">Secure sign in</div>
    <h1>Opening your business workspace…</h1>
    <p>This one-time link will create a secure browser session. It cannot be reused after a successful sign-in.</p>
    <div id="signin-status" class="status">Verifying your sign-in link…</div>
    <a id="signin-fallback" class="button" href="./app.html" hidden>Return to sign in</a>
  </main>
  <script type="module" src="./assets/tenant-signin.mjs"></script>
</body>
</html>
