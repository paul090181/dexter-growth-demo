name: Preview 16 Square app inspector

on:
  pull_request:
    branches:
      - platform-v1

permissions:
  contents: read

jobs:
  preview16-square-app-inspect:
    if: github.event.pull_request.number == 16
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read safe Square app binding
        shell: bash
        run: |
          set -euo pipefail
          url="https://deploy-preview-16--euphonious-beijinho-db4b4d.netlify.app/.netlify/functions/preview16-square-token-status"
          for attempt in $(seq 1 30); do
            body_file="$(mktemp)"
            http_code="$(curl --silent --show-error --max-time 15 --output "$body_file" --write-out "%{http_code}" "$url" 2>/dev/null || printf "000")"
            body="$(cat "$body_file")"
            rm -f "$body_file"
            if [ "$http_code" = "200" ] && [ -n "$body" ]; then
              echo "SQUARE_APP_JSON=$body"
              node -e '
                const value = JSON.parse(process.argv[1]);
                if (value.ok === true && typeof value.client_id === "string" && value.client_id && value.token_returned === false) process.exit(0);
                process.exit(1);
              ' "$body"
              exit 0
            fi
            echo "Inspector not ready yet (attempt $attempt/30, HTTP $http_code)."
            sleep 5
          done
          echo "Preview 16 Square app inspector failed."
          exit 1
