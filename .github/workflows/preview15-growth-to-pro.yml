name: Preview 15 Growth to Pro acceptance

on:
  pull_request:
    branches:
      - platform-v1

permissions:
  contents: read

jobs:
  preview15-growth-to-pro:
    if: github.event.pull_request.number == 15
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify Preview 15 Growth to Pro lifecycle
        shell: bash
        run: |
          set -euo pipefail
          url="https://deploy-preview-15--euphonious-beijinho-db4b4d.netlify.app/.netlify/functions/preview15-stripe-plan-acceptance"
          for attempt in $(seq 1 20); do
            body_file="$(mktemp)"
            http_code="$(curl --silent --show-error --max-time 30 --output "$body_file" --write-out "%{http_code}" "$url" 2>/dev/null || printf "000")"
            body="$(cat "$body_file")"
            rm -f "$body_file"
            if [ -n "$body" ]; then
              echo "ACCEPTANCE_HTTP=$http_code"
              echo "ACCEPTANCE_JSON=$body"
              if [ "$http_code" = "200" ] && node -e '
                const value = JSON.parse(process.argv[1]);
                if (
                  value.ok === true &&
                  value.sandbox_account_verified === true &&
                  value.portal_plan_change_session_created === true &&
                  value.growth_webhook_synced === true &&
                  value.stripe_metadata_intentionally_stale === true &&
                  value.stripe_price_changed_to_pro === true &&
                  value.growthwise_plan_changed_to_pro === true &&
                  value.plan_started_at_reset === true &&
                  value.pro_entitlements_active === true &&
                  value.cleanup?.subscription_canceled === true &&
                  value.cleanup?.customer_deleted === true &&
                  value.cleanup?.database_cleaned === true &&
                  value.cleanup?.persisted_subscription_row === false &&
                  value.production_touched === false
                ) process.exit(0);
                process.exit(1);
              ' "$body"; then
                exit 0
              fi
            fi
            echo "Acceptance not ready/passed yet (attempt $attempt/20)."
            sleep 5
          done
          echo "Preview 15 Growth to Pro acceptance failed."
          exit 1
