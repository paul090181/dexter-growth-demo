name: Preview 16 Square redirect smoke

on:
  push:
    branches:
      - feat/tenant-onboarding-integrations

permissions:
  contents: read

jobs:
  square-redirect-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify live Preview redirects to Square sandbox
        shell: bash
        run: |
          set -euo pipefail
          url="https://deploy-preview-16--euphonious-beijinho-db4b4d.netlify.app/.netlify/functions/preview16-square-acceptance?browser=start"
          for attempt in $(seq 1 40); do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --silent --show-error --max-time 20 --output "$body" --dump-header "$headers" --write-out "%{http_code}" --max-redirs 0 "$url" || true)"
            if [ "$code" = "303" ] || [ "$code" = "302" ]; then
              location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$headers")"
              python -c 'import sys,urllib.parse as u; p=u.urlparse(sys.argv[1]); q=u.parse_qs(p.query); assert p.scheme=="https" and p.netloc=="connect.squareupsandbox.com" and p.path=="/oauth2/authorize"; assert all(len(q.get(k,[]))==1 for k in ("client_id","scope","session","state")); assert q["session"][0]=="false"; print("LIVE_SQUARE_REDIRECT_OK")' "$location"
              rm -f "$headers" "$body"
              exit 0
            fi
            echo "Preview response attempt $attempt: HTTP $code"
            rm -f "$headers" "$body"
            sleep 5
          done
          echo "Preview 16 never produced a valid Square sandbox redirect."
          exit 1
